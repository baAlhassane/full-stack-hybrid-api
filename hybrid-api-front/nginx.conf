
server {
    listen 80;

    server_name localhost;

    # Racine du frontend Angular buildé
    root /usr/share/nginx/html;
    index index.html;

    # Frontend Angular
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API Spring Boot
    location /api/hybrid-api/ {
        proxy_pass http://hybrid-api-backend-service:8081;  # Service Kubernetes du backend
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection keep-alive;
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Autoriser les requêtes cross-origin depuis le frontend
        add_header Access-Control-Allow-Origin *;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS";
        add_header Access-Control-Allow-Headers "Origin, Content-Type, Accept, Authorization";
        add_header Access-Control-Allow-Credentials true;

        # Répondre aux OPTIONS (pré-vol CORS)
        if ($request_method = OPTIONS ) {
            add_header Access-Control-Max-Age 1728000;
           add_header Content-Type "text/plain; charset=utf-8";
            add_header Content-Length 0;
            return 204;
        }
    }

    # Erreurs
    error_page 404 /index.html;
}


