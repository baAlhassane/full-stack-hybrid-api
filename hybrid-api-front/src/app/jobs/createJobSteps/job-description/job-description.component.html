<div class="surface-card p-3 border-round-xl shadow-2 w-full max-w-32rem mx-auto mt-2">

  <div class="flex align-items-center mb-2 border-bottom-1 border-100 pb-2">
    <i class="pi pi-pencil text-primary text-xl mr-2"></i>
    <h2 class="text-lg font-bold text-900 m-0">Détails</h2>
  </div>

  <form #formDescription="ngForm" class="flex flex-column gap-2">

    <div class="flex flex-column gap-1">
      <label for="title" class="text-xs font-semibold text-700 ml-1">Titre</label>
      <div class="grid grid-nogutter align-items-center border-1 border-300 border-round-lg surface-50 focus-within:border-primary">
        <div class="col-fixed flex justify-content-center border-right-1 border-200" style="width: 2.5rem;">
          <i class="pi pi-bookmark text-sm text-600"></i>
        </div>
        <div class="col">
          <input
            pInputText
            id="title"
            name="title"
            type="text"
            placeholder="Titre..."
            [ngModel]="title()"
            (ngModelChange)="onTitleChange($event)"
            class="w-full border-none bg-transparent p-2 text-sm focus:shadow-none"
          >
        </div>
      </div>
    </div>

    <div class="flex flex-column gap-1">
      <label for="description" class="text-xs font-semibold text-700 ml-1">Description</label>
      <div class="grid grid-nogutter border-1 border-300 border-round-lg surface-50 focus-within:border-primary">
        <div class="col-fixed flex justify-content-center pt-2 border-right-1 border-200" style="width: 2.5rem;">
          <i class="pi pi-align-left text-sm text-600"></i>
        </div>
        <div class="col">
          <textarea
            pInputTextarea
            id="description"
            name="description"
            rows="3"
            [autoResize]="false"
            placeholder="Description courte..."
            [ngModel]="description()"
            (ngModelChange)="onDescriptionChange($event)"
            class="w-full border-none bg-transparent p-2 text-sm focus:shadow-none"
            style="min-height: 80px;"
          ></textarea>
        </div>
      </div>
    </div>

  </form>
</div>
