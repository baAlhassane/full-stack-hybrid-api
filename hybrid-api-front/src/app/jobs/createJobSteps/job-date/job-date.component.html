<p>job-date works!</p>

<div class="surface-card p-3 border-round-xl shadow-2 w-full max-w-32rem mx-auto mt-2">

  <div class="flex align-items-center mb-3 border-bottom-1 border-100 pb-2">
    <i class="pi pi-calendar text-primary text-xl mr-2"></i>
    <h2 class="text-xl font-bold text-900 m-0">Date de la mission</h2>
  </div>

  <div class="flex flex-column gap-1">
    <label for="date" class="text-xs font-semibold text-700 ml-1">Sélectionner un jour</label>

    <div class="grid grid-nogutter align-items-center border-1 border-300 border-round-lg surface-50 focus-within:border-primary transition-colors">
      <div class="col-fixed flex justify-content-center border-right-1 border-200" style="width: 2.5rem;">
        <i class="pi pi-calendar-plus text-sm text-600"></i>
      </div>

      <div class="col">
        <p-calendar
          id="date"
          [ngModel]="dateForPicker()"
          (ngModelChange)="onDateChange($event)"
          dateFormat="dd/mm/yy"
          [showIcon]="false"
          [readonlyInput]="true"
          appendTo="body"
          placeholder="Ex: 15/01/2026"
          styleClass="w-full"
          inputStyleClass="w-full border-none bg-transparent p-2 text-base focus:shadow-none">
        </p-calendar>
      </div>
    </div>
    <small class="text-500 italic ml-1">Quand la mission doit-elle commencer ?</small>
  </div>
</div>
