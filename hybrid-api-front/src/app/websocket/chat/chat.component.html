
<div class="chat-dashboard">
  <!-- Zone des messages -->
  <div #messagesContainer class="messages-container">
    <div
      *ngFor="let msg of messages"
      class="message"
      [ngClass]="{
        'own-message': msg.sender === user().firstname,
        'system-message': msg.sender === 'SYSTEM'
      }"
    >
      <!-- Message utilisateur -->
      <div *ngIf="msg.sender !== 'SYSTEM'">
        <div class="message-header">
          <strong>{{ msg.sender }}</strong>
          <span class="timestamp">{{ msg.timestamp | relativeTime }}</span>
        </div>
        <div class="message-content">{{ msg.content }}</div>
      </div>

      <!-- Message système -->
      <div *ngIf="msg.sender === 'SYSTEM'" class="system-notification">
        <i class="fas fa-info-circle"></i>
        {{ msg.content }}
      </div>
    </div>
  </div>

  <!-- Liste des utilisateurs connectés -->
  <div class="users-container">
    <h4>Utilisateurs connectés</h4>
    <ul>
      <li *ngFor="let user of senders">

        {{ user.firstname + " " + user.lastname +" ("  +user.userType+ " )" }} </li>
    </ul>
  </div>
</div>

<!-- Input pour envoyer un message -->
<div class="chat-input">
  <input
    [(ngModel)]="newMessage"
    (keyup.enter)="send()"
    placeholder="Écrire un message..."
  />
  <button (click)="send()">Envoyer</button>
</div>
