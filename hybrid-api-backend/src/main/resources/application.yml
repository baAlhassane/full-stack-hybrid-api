logging:
#  file:
#    name: /logs/hybrid-api.log
  level:
    org:
      springframework:
        security: TRACE #DEBUG
        org.springframework.kafka: DEBUG
        org.apache.kafka: INFO
    com:
      mycompany: INFO

spring:
  servlet:
    multipart:
      enabled: true
      # Autorise jusqu'à 10 Mo par image
      max-file-size: 100MB
      # Autorise jusqu'à 50 Mo pour l'ensemble de la requête (toutes les photos + le JSON)
      max-request-size: 100MB
      # Important : permet de traiter les données avant que les filtres ne bloquent
      resolve-lazily: true
  datasource:
    url: jdbc:postgresql://localhost:5432/hybrid_api
    username: postgres
    password: draslom3
    driverClassName: org.postgresql.Driver

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: create
    show-sql: false

  flyway:
    enabled: true
    baseline-on-migrate: true

  kafka:
    bootstrap-servers: localhost:29092  # kafka:9092
    # Propriétés spécifiques au consommateur
    consumer:
      group-id: my-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # Changez le désérialiseur de valeur pour lire les objets JSON
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        # Indique au désérialiseur la classe de l'objet attendu
        spring.json.value.default.type: com.alhas.hybrid_api.websocket.notification.UserEvent

    # Propriétés spécifiques au producteur
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      # Changez le sérialiseur de valeur pour envoyer des objets en JSON
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

