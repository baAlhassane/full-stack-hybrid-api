version: '3.8'

services:
  postgres:
    container_name: hybrid_api_container
    image: 'postgres:latest'
    environment:
      - POSTGRES_DB=hybrid_api
      - POSTGRES_PASSWORD=draslom3
      - POSTGRES_USER=postgres
      - PGDATA=/var/lib/postgresql/data
    volumes:
      - hybrid_api:/var/lib/postgresql/data
    ports:
      - '5432:5432'

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka-hybrid-api
    depends_on:
        - zookeeper
    ports:
        - "9092:9092"      # accès depuis d'autres conteneurs (ex: ton backend dans Docker)
        - "29092:29092"    # accès depuis l’hôte (Windows/WSL)
    environment:
        KAFKA_BROKER_ID: 1
        KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
        KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
        KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
        KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
        KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
  kafdrop:
    image: obsidiandynamics/kafdrop:latest
    container_name: kafdrop
    depends_on:
      - kafka
    ports:
      - "9000:9000"
    environment:
      KAFKA_BROKERCONNECT: kafka:9092

volumes:
  hybrid_api:
    name: hybrid_api_volume

